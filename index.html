<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Obscura</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== Base ===== */
* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  background: #020617;
  color: #e5e7eb;
  padding: 20px;
}

/* ===== Intro Overlay ===== */
#intro {
  position: fixed;
  inset: 0;
  background: #020617;
  z-index: 9999;
  overflow: hidden;
  animation: introFadeOut 1s ease forwards;
  animation-delay: 2.6s;
}

.intro-content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  animation: introPop 1.6s ease forwards;
}

.intro-content h1 {
  letter-spacing: 0.35em;
  font-size: 28px;
  margin: 0 0 12px;
}

.intro-content p {
  font-size: 12px;
  color: #94a3b8;
}

.noise {
  position: absolute;
  inset: -50%;
  background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  animation: noiseMove 0.3s steps(2) infinite;
}

/* ===== Layout ===== */
.container {
  max-width: 900px;
  margin: 0 auto;
}

h2 {
  font-weight: 500;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

textarea {
  width: 100%;
  min-height: 180px;
  background: #020617;
  color: #e5e7eb;
  border: 1px solid #334155;
  padding: 12px;
  resize: vertical;
  outline: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

textarea::placeholder {
  color: #475569;
}

/* ===== Actions ===== */
.actions {
  display: flex;
  gap: 10px;
  margin: 12px 0 20px;
  flex-wrap: wrap;
}

.actions button {
  background: #020617;
  color: #e5e7eb;
  border: 1px solid #334155;
  padding: 8px 14px;
  cursor: pointer;
  transition: background 0.2s, border 0.2s;
}

.actions button:hover {
  background: #0f172a;
  border-color: #64748b;
}

/* ===== Animations ===== */
@keyframes introPop {
  0% { opacity: 0; transform: translate(-50%, -55%); }
  100% { opacity: 1; transform: translate(-50%, -50%); }
}

@keyframes introFadeOut {
  to { opacity: 0; pointer-events: none; }
}

@keyframes noiseMove {
  0% { transform: translate(0,0); }
  100% { transform: translate(-10%,10%); }
}
</style>
</head>

<body>

<!-- Intro Overlay -->
<div id="intro">
  <div class="noise"></div>
  <div class="intro-content">
    <h1>OBSCURA</h1>
    <p>Initializing obfuscation layers...</p>
  </div>
</div>

<div class="container">
  <h2>INPUT</h2>
  <textarea id="input" placeholder="Paste your Lua code here..."></textarea>

  <div class="actions">
    <button onclick="obfuscate()">Obfuscate</button>
    <button onclick="copyAll()">Copy All</button>
    <button onclick="downloadFile('lua')">Download as .lua</button>
    <button onclick="downloadFile('txt')">Download as .txt</button>
  </div>

  <h2>OUTPUT</h2>
  <textarea id="output" placeholder="Obfuscated code will appear here..." readonly></textarea>
</div>

<script>
/* ===== Intro Remove ===== */
setTimeout(() => {
  const intro = document.getElementById("intro");
  if (intro) intro.remove();
}, 3600);

/* ===== 難読化コアロジック ===== */
// ランダムな16進数形式の変数名を生成する関数（例: _0x8f2a4c）
function makeTrashName() {
  return "_0x" + Math.random().toString(16).slice(2, 8);
}

// 読解を邪魔するための無意味なLuaのダミーコード（ゴミコード）をランダム生成する関数
function makeJunkCode() {
  const junkTemplates = [
    `local ${makeTrashName()} = math.sin(math.pi * 0.5)`,
    `local ${makeTrashName()} = tonumber("10") or 0`,
    `if false then print("${makeTrashName()}") end`,
    `local ${makeTrashName()} = table.concat({}, "")`,
    `for _ = 1, 0 do local ${makeTrashName()} = 99 end`,
    `local ${makeTrashName()} = string.reverse("${makeTrashName()}")`,
    `local ${makeTrashName()} = type(pairs) == "function"`
  ];
  // ランダムに3つ選んで結合
  let res = "";
  for (let i = 0; i < 3; i++) {
    res += "    " + junkTemplates[Math.floor(Math.random() * junkTemplates.length)] + "\n";
  }
  return res;
}

function obfuscate() {
  const input = document.getElementById("input").value;
  if (!input) return alert("No input code.");

  try {
    // 1. ボタンを押すたびにすべての主要な内部変数名・関数名をランダムに変更
    const v_data      = makeTrashName(); // 暗号データの格納先
    const v_decode    = makeTrashName(); // デコード関数名
    const v_b         = makeTrashName(); // Base64テーブル
    const v_x         = makeTrashName(); // ローカル引数
    const v_r         = makeTrashName(); // ビット文字列用
    const v_f         = makeTrashName(); // 計算用
    const v_i         = makeTrashName(); // ループカウンタ
    const v_c         = makeTrashName(); // 文字コード
    const v_raw       = makeTrashName(); // 復元された生コード
    const v_exec      = makeTrashName(); // loadstring実行用

    // 2. 元のLuaコードをBase64化
    const b64Encoded = btoa(unescape(encodeURIComponent(input)));

    // 3. 元の文字列をすべて `\数字`（ByteCodeエスケープ形式）の羅列へ100%変換
    let byteCodeObfuscated = "";
    for (let i = 0; i < b64Encoded.length; i++) {
      byteCodeObfuscated += "\\" + b64Encoded.charCodeAt(i);
    }

    // 4. ランダム変数名と、各行に埋め込まれるゴミコードをブレンドして出力コードをビルド
    const outputCode = `-- Obfuscated by Obscura
local ${v_data} = "${byteCodeObfuscated}"
${makeJunkCode()}
local function ${v_decode}(data)
    local ${v_b} = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
    data = string.gsub(data, '[^'..${v_b}..'=]', '')
${makeJunkCode()}
    return (data:gsub('.', function(${v_x})
        if (${v_x} == '=') then return '' end
        local ${v_r}, ${v_f} = '', (${v_b}:find(${v_x}) - 1)
        for ${v_i} = 6, 1, -1 do ${v_r} = ${v_r} .. (${v_f} % 2^${v_i} - ${v_f} % 2^(${v_i}-1) > 0 and '1' or '0') end
        return ${v_r};
    end):gsub('%d%d%d%d%d%d%d%d', function(${v_x})
        local ${v_c} = 0
${makeJunkCode()}
        for ${v_i} = 1, 8 do ${v_c} = ${v_c} + (${v_x}:sub(${v_i},${v_i}) == '1' and 2^(8-${v_i}) or 0) end
        return string.char(${v_c})
    end))
end
${makeJunkCode()}
local ${v_raw} = ${v_decode}(${v_data})
local ${v_exec} = assert((loadstring or load)(${v_raw}))
${v_exec}()`;

    document.getElementById("output").value = outputCode;
  } catch (e) {
    alert("Obfuscation failed: " + e.message);
  }
}

function copyAll() {
  const text = document.getElementById("output").value;
  if (!text) return alert("Nothing to copy.");
  navigator.clipboard.writeText(text);
  alert("Copied.");
}

function downloadFile(ext) {
  const text = document.getElementById("output").value;
  if (!text) return alert("Nothing to download.");

  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "obscura_output." + ext;
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
