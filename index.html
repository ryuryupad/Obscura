<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSCURA ENGINE v2.0 - Virtual Machine Lua Obfuscator</title>
    <style>
        :root {
            --bg-base: #020617;
            --bg-panel: #0f172a;
            --bg-header: #1e293b;
            --accent-purple: #a855f7;
            --accent-purple-glow: rgba(168, 85, 247, 0.4);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --output-green: #34d399;
            --output-green-glow: rgba(52, 211, 153, 0.2);
            --border-color: #334155;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-mono);
            overflow: hidden;
        }

        /* Intro Overlay */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-base);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .noise-container {
            position: relative;
            text-align: center;
        }

        .glitch-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 0.3rem;
            color: var(--accent-purple);
            text-shadow: 0 0 20px var(--accent-purple-glow);
            animation: pulseGlow 1.5s infinite alternate;
        }

        .glitch-subtitle {
            margin-top: 1rem;
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 0.15rem;
        }

        .loader-bar {
            width: 280px;
            height: 3px;
            background: var(--border-color);
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        .loader-progress {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-purple), transparent);
            animation: loadingProgress 3.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Layout Structure */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header {
            height: 50px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.1rem;
            color: var(--accent-purple);
        }

        .brand-badge {
            font-size: 0.7rem;
            background: var(--accent-purple-glow);
            border: 1px solid var(--accent-purple);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 120px);
            gap: 1px;
            background-color: var(--border-color);
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-base);
            position: relative;
        }

        .column-header {
            height: 36px;
            background-color: var(--bg-header);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            border: none;
            outline: none;
            padding: 1rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            line-height: 1.5;
            resize: none;
            user-select: text;
        }

        #input-source {
            color: var(--text-main);
        }

        #output-payload {
            color: var(--output-green);
            background-color: #010409;
            text-shadow: 0 0 5px var(--output-green-glow);
        }

        /* Control Bar */
        .control-bar {
            height: 70px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 0 2rem;
        }

        .btn {
            background-color: var(--bg-header);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-purple-glow);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7e22ce, #a855f7);
            border: none;
            color: #ffffff;
            box-shadow: 0 0 15px var(--accent-purple-glow);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #9333ea, #c084fc);
            box-shadow: 0 0 25px var(--accent-purple-glow);
        }

        /* Keyframe Animations */
        @keyframes pulseGlow {
            0% { opacity: 0.8; text-shadow: 0 0 10px var(--accent-purple-glow); }
            100% { opacity: 1; text-shadow: 0 0 25px var(--accent-purple); }
        }

        @keyframes loadingProgress {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>

    <!-- Intro Overlay -->
    <div id="intro-overlay">
        <div class="noise-container">
            <div class="glitch-title">OBSCURA ENGINE</div>
            <div class="glitch-subtitle">Deploying Virtual Machine Architecture...</div>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <header>
            <div class="brand">
                <span>OBSCURA ENGINE</span>
                <span class="brand-badge">v2.0 VM-CORE</span>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">ENTERPRISE OBFUSCATION PIPELINE</div>
        </header>

        <div class="workspace">
            <!-- Left Column: Source Input -->
            <div class="column">
                <div class="column-header">SOURCE LUA PIPELINE</div>
                <div class="editor-wrapper">
                    <textarea id="input-source" spellcheck="false" placeholder="-- Paste your target Lua code here...&#10;print('Hello World from Obscura Engine!')"></textarea>
                </div>
            </div>

            <!-- Right Column: Obfuscated Output -->
            <div class="column">
                <div class="column-header">OBLITERATED VM PAYLOAD</div>
                <div class="editor-wrapper">
                    <textarea id="output-payload" readonly spellcheck="false" placeholder="-- Compiled VM payload will be emitted here..."></textarea>
                </div>
            </div>
        </div>

        <!-- Control Bar -->
        <div class="control-bar">
            <button class="btn btn-primary" id="btn-compile">
                <span>Compile Pipeline</span>
            </button>
            <button class="btn" id="btn-copy">
                <span>Copy To Clipboard</span>
            </button>
            <button class="btn" id="btn-export">
                <span>Export Asset (.lua)</span>
            </button>
        </div>
    </div>

    <script>
        // Intro Overlay Handler
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const overlay = document.getElementById('intro-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.visibility = 'hidden';
                }, 600);
            }, 3200);
        });

        // Utility: Generate Random Hex Variable Name
        function generateHexVar() {
            const hexChars = '0123456789abcdef';
            let hex = '_0x';
            for (let i = 0; i < 6; i++) {
                hex += hexChars[Math.floor(Math.random() * hexChars.length)];
            }
            return hex;
        }

        // Utility: Generate Random Camouflage Junk Lua Code
        function generateJunkCode() {
            const templates = [
                () => `local ${generateHexVar()} = math.sin(${Math.floor(Math.random() * 1000)}) * math.cos(${Math.floor(Math.random() * 1000)})`,
                () => `if ${Math.floor(Math.random() * 100)} == ${Math.floor(Math.random() * 100) + 101} then local ${generateHexVar()} = "${generateHexVar()}" end`,
                () => `local ${generateHexVar()} = function(...) return {...} end`,
                () => `local ${generateHexVar()} = string.reverse("${generateHexVar()}")`,
                () => `local ${generateHexVar()} = { [${Math.floor(Math.random() * 50)}] = ${Math.floor(Math.random() * 999)} }`
            ];
            const count = Math.floor(Math.random() * 2) + 1;
            let junks = [];
            for (let i = 0; i < count; i++) {
                junks.push(templates[Math.floor(Math.random() * templates.length)]());
            }
            return junks.join(';\n');
        }

        // Core Obfuscation Logic
        function obfuscateLua(sourceCode) {
            if (!sourceCode.trim()) return '-- ERROR: Source pipeline is empty.';

            // Layer 1: Unicode-Safe Base64 Encoding
            const b64Data = btoa(unescape(encodeURIComponent(sourceCode)));

            // Layer 2: Dynamic XOR & 3-Digit Fixed Length Bytecode Stream
            const xorSeed = Math.floor(Math.random() * 254) + 1;
            let bytecodeStream = '';

            for (let i = 0; i < b64Data.length; i++) {
                const charCode = b64Data.charCodeAt(i);
                const xorVal = charCode ^ xorSeed;
                const paddedStr = String(xorVal).padStart(3, '0');
                bytecodeStream += '\\' + paddedStr;
            }

            // Layer 3: Polymorphic Variable Generation
            const vData = generateHexVar();
            const vSeed = generateHexVar();
            const vB64Tbl = generateHexVar();
            const vDecodeFn = generateHexVar();
            const vStack = generateHexVar();
            const vPC = generateHexVar();
            const vInst = generateHexVar();
            const vResult = generateHexVar();
            const vStrAcc = generateHexVar();
            const vByte = generateHexVar();
            const vIdx = generateHexVar();
            const vLen = generateHexVar();
            const vChar = generateHexVar();
            const vA = generateHexVar();
            const vB = generateHexVar();
            const vC = generateHexVar();
            const vD = generateHexVar();
            const vB1 = generateHexVar();
            const vB2 = generateHexVar();
            const vB3 = generateHexVar();

            // Construct VM Payload Structure
            const luaPayload = `--[[ OBSCURA ENGINE v2.0 - VIRTUAL MACHINE PROTECTED PAYLOAD ]]
${generateJunkCode()}
local ${vData} = "${bytecodeStream}"
local ${vSeed} = ${xorSeed}
${generateJunkCode()}

local ${vB64Tbl} = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
local function ${vDecodeFn}(data)
    ${generateJunkCode()}
    data = string.gsub(data, '[^'..${vB64Tbl}..'=]', '')
    return (data:gsub('.', function(x)
        if (x == '=') then return '' end
        local r,f='',( ${vB64Tbl}:find(x)-1 )
        for i=6,1,-1 do r=r..(f%2^i>=2^(i-1) and '1' or '0') end
        return r
    end):gsub('%d%d%d%d%d%d%d%d', function(x)
        local c=0
        for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end
        return string.char(c)
    end))
end

${generateJunkCode()}
local ${vStrAcc} = {}
local ${vLen} = #${vData}
local ${vIdx} = 1

while ${vIdx} <= ${vLen} do
    local ${vByte} = tonumber(${vData}:sub(${vIdx}, ${vIdx}+2))
    table.insert(${vStrAcc}, string.char(bit32 and bit32.bxor(${vByte}, ${vSeed}) or (function(a,b)
        local p,c=1,0
        while a>0 and b>0 do
            local ra,rb=a%2,b%2
            if ra~=rb then c=c+p end
            a,b,p=(a-ra)/2,(b-rb)/2,p*2
        end
        if a<b then a=b end
        while a>0 do
            local ra=a%2
            if ra>0 then c=c+p end
            a,p=(a-ra)/2,p*2
        end
        return c
    end)(${vByte}, ${vSeed})))
    ${vIdx} = ${vIdx} + 3
end

${generateJunkCode()}
local ${vStack} = {}
table.insert(${vStack}, ${vDecodeFn}(table.concat(${vStrAcc})))

local ${vPC} = 1
while ${vPC} <= #${vStack} do
    local ${vInst} = ${vStack}[${vPC}]
    ${vPC} = ${vPC} + 1
    local ${vResult} = assert((loadstring or load)(${vInst}))
    if type(${vResult}) == "function" then
        ${vResult}()
    end
end
${generateJunkCode()}`;

            return luaPayload;
        }

        // DOM Element Handlers & Event Listeners
        const inputSource = document.getElementById('input-source');
        const outputPayload = document.getElementById('output-payload');
        const btnCompile = document.getElementById('btn-compile');
        const btnCopy = document.getElementById('btn-copy');
        const btnExport = document.getElementById('btn-export');

        // Compile Pipeline Action
        btnCompile.addEventListener('click', () => {
            const rawSource = inputSource.value;
            const compiled = obfuscateLua(rawSource);
            outputPayload.value = compiled;
        });

        // Copy To Clipboard Action
        btnCopy.addEventListener('click', () => {
            if (!outputPayload.value) return;
            navigator.clipboard.writeText(outputPayload.value).then(() => {
                const originalText = btnCopy.innerText;
                btnCopy.innerText = 'Copied!';
                setTimeout(() => {
                    btnCopy.innerText = originalText;
                }, 1500);
            });
        });

        // Export Asset (.lua) Action
        btnExport.addEventListener('click', () => {
            const content = outputPayload.value;
            if (!content) return;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `obscura_payload_${Date.now()}.lua`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
